<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#111115">
    <script>
        (function () {
            var theme = 'dark';
            try {
                var stored = localStorage.getItem('ncl-theme');
                if (stored === 'light' || stored === 'dark') theme = stored;
                else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
            } catch (e) {}
            document.documentElement.dataset.theme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f1ee' : '#111115');
        })();
    </script>
    <title>Perfil · NCL Opus</title>
    <link rel="icon" type="image/png" href="img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,700;1,800&display=swap">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar__inner">
            <div class="nav-brand">
                <button type="button" id="theme-switch" class="theme-switch" aria-label="Cambiar a modo claro">
                    <span class="theme-switch__track">
                        <span class="theme-switch__thumb">
                            <svg class="theme-switch__icon theme-switch__icon--sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
                            <svg class="theme-switch__icon theme-switch__icon--moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
                        </span>
                    </span>
                </button>
            <a href="index.html" class="logo" aria-label="NCL Opus">
                <img class="logo-mark" src="img/GDL-Opus.png" alt="" width="40" height="40">
                <span class="logo-type"><span class="logo-name">NCL</span><span class="logo-opus">Opus</span>                </span>
            </a>
            </div>

            <div class="nav-actions">
                <button id="btn-open-submit" class="btn-primary nav-submit" type="button" aria-haspopup="dialog" hidden>
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span class="hide-compact">Subir récord</span>
                </button>
                <div class="auth-section" id="auth-section">
                    <button id="btn-login" class="btn-discord" type="button">
                        <svg class="icon" width="18" height="18" viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true" focusable="false"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-19.32-72.15ZM42.68,65.27C36.67,65.27,31.7,59.65,31.7,52.7c0-6.86,4.78-12.58,10.98-12.58,6.26,0,11.11,5.81,10.98,12.58C53.66,59.65,48.8,65.27,42.68,65.27Zm41.85,0c-6.01,0-10.98-5.62-10.98-12.58,0-6.86,4.78-12.58,10.98-12.58,6.26,0,11.11,5.81,10.98,12.58C95.51,59.65,90.65,65.27,84.53,65.27Z"/></svg>
                        <span>Iniciar sesión<span class="hide-compact"> con Discord</span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="profile-banner" class="profile-header" role="status" aria-label="Cargando perfil">
            <div class="profile-banner profile-banner--loading"></div>
            <div class="profile-stats profile-stats--loading" aria-hidden="true"></div>
        </div>

        <div id="records-header" class="section-header">
            <div>
                <h2 class="section-heading">Récords</h2>
                <p class="section-lead">Los tres de más puntos suman el total del perfil.</p>
            </div>
            <button id="btn-mod-add-record" class="btn-outline btn-sm" type="button" aria-haspopup="dialog" hidden>
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                Añadir récord
            </button>
        </div>

        <div id="records-grid" class="records-grid">
            <div class="skeleton-card skeleton-card--record"></div>
            <div class="skeleton-card skeleton-card--record"></div>
            <div class="skeleton-card skeleton-card--record"></div>
        </div>
    </main>

    <div id="comments-modal" class="modal-overlay" data-dismiss="backdrop">
        <div class="modal-content modal-content--scroll" role="dialog" aria-modal="true" aria-labelledby="modal-lvl-title">
            <div class="modal-header">
                <div>
                    <p class="modal-eyebrow">Comentarios</p>
                    <h2 id="modal-lvl-title">Nivel</h2>
                </div>
                <button id="btn-close-comments" class="btn-close-icon" type="button" aria-label="Cerrar">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div class="like-row">
                <button id="btn-like-submit" class="btn-outline btn-sm btn-like" type="button" aria-pressed="false">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span id="like-count" class="tabular">0</span>
                    <span id="like-label">Me gusta</span>
                </button>
            </div>

            <div id="comments-list" class="comments-list" aria-live="polite"></div>

            <form id="comment-form" class="comment-composer" novalidate>
                <label class="visually-hidden" for="new-comment-input">Comentario</label>
                <input type="text" id="new-comment-input" class="input-field" placeholder="Escribe un comentario" maxlength="500" autocomplete="off">
                <button id="btn-send-comment" class="btn-primary" type="submit">Enviar</button>
            </form>
            <p id="comment-login-hint" class="comment-hint" hidden>Inicia sesión para comentar y dar me gusta.</p>
            <p id="comment-feedback" class="form-feedback form-feedback--error" role="status"></p>
        </div>
    </div>

    <div id="mod-add-modal" class="modal-overlay" data-dismiss="backdrop">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="mod-add-title">
            <div class="modal-header">
                <h2 id="mod-add-title">Añadir récord</h2>
                <button id="btn-mod-close" class="btn-close-icon" type="button" aria-label="Cerrar">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <form id="mod-add-form" novalidate>
                <p class="modal-lead">Se guarda como aceptado y los puntos del perfil se recalculan al momento.</p>
                <div class="field">
                    <label class="field__label" for="mod-lvl-name">Nombre del nivel</label>
                    <input type="text" id="mod-lvl-name" class="input-field" placeholder="Ej. Kyouki" autocomplete="off">
                </div>
                <div class="field">
                    <label class="field__label" for="mod-lvl-id">ID del nivel</label>
                    <input type="text" id="mod-lvl-id" class="input-field" inputmode="numeric" placeholder="Ej. 12345678" autocomplete="off">
                </div>
                <div class="field">
                    <label class="field__label" for="mod-lvl-video">Enlace al video</label>
                    <input type="url" id="mod-lvl-video" class="input-field" placeholder="https://youtu.be/…" autocomplete="off">
                </div>
                <div class="field">
                    <label class="field__label" for="mod-lvl-pts">Puntos</label>
                    <input type="text" id="mod-lvl-pts" class="input-field" inputmode="numeric" placeholder="Ej. 120" autocomplete="off">
                </div>
                <p id="mod-add-feedback" class="form-feedback form-feedback--error" role="status"></p>
                <div class="modal-actions">
                    <button id="btn-mod-cancel" class="btn-outline" type="button">Cancelar</button>
                    <button id="btn-mod-submit" class="btn-primary" type="submit">Guardar récord</button>
                </div>
            </form>
        </div>
    </div>

    <div id="banner-modal" class="modal-overlay" data-dismiss="backdrop">
        <div class="banner-modal-content" role="dialog" aria-modal="true" aria-labelledby="banner-modal-title" aria-describedby="banner-points-label">
            <div class="modal-header">
                <div>
                    <h2 id="banner-modal-title">Elige tu banner</h2>
                    <p id="banner-points-label" class="modal-lead modal-lead--tight"></p>
                </div>
                <button id="btn-close-banner-modal" class="btn-close-icon" type="button" aria-label="Cerrar">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div id="banner-progress" class="banner-progress"></div>
            <div id="banner-list" class="banner-scroll-list"></div>
            <p id="banner-feedback" class="banner-feedback" role="status" hidden></p>
            <input type="file" id="banner-file-input" class="banner-file-input" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>
    </div>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/Submit.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
