<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Moderación - GDNC</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- --- NAVBAR PRINCIPAL --- -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-g">G</span><span class="logo-dn">DN</span><span class="logo-c">C</span>
            <span class="logo-list">List</span>
        </a>
        
        <button id="mobile-menu-btn" class="menu-toggle">☰</button>
        
        <div class="nav-actions" id="nav-actions">
            <button id="btn-open-submit" class="btn-submit" style="display: none;">+ Subir Récord</button>
            <div class="auth-section" id="auth-section">
                <button id="btn-login" class="btn-primary">Iniciar sesión con Discord</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section style="margin-bottom: 25px;">
            <h2 style="font-size: 2rem; color: var(--text-main);">Récords Pendientes</h2>
            <p style="color: var(--text-muted);">Revisa la evidencia, asigna los puntos y actualiza la lista.</p>
        </section>

        <!-- Aquí inyectaremos los récords pendientes -->
        <div id="pendientes-container" class="ranking-grid">
            <p style="color: var(--text-muted);">Verificando permisos...</p>
        </div>
    </main>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/auth.js"></script> <!-- Necesario para que funcione el Navbar -->
    <script type="module" src="js/mod.js"></script>
</body>
</html>
